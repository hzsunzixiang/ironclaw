[package]
name = "mini-agent-wasm-session"
version = "0.1.0"
edition = "2021"
description = """
Mini Agent Loop with WASM Sandbox + Session Management — IronClaw Core Distilled.
Demonstrates: Session → Thread → Turn model with multi-turn conversation history,
WASM sandbox tool execution, and thread management commands.
"""
publish = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for LLM API
reqwest = { version = "0.12", features = ["json", "stream"] }

# Home directory for config
dirs = "5"

# WASM sandbox runtime
wasmtime = { version = "28", features = ["component-model"] }
wasmtime-wasi = "28"

# UUID for session/thread/turn IDs
uuid = { version = "1", features = ["v4"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

[workspace]
