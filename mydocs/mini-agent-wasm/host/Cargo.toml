[package]
name = "mini-agent-wasm"
version = "0.1.0"
edition = "2021"
description = """
Mini Agent Loop with WASM Sandbox — IronClaw Core Distilled.
Demonstrates: stdin → LLM → WASM Sandbox Tool Execute → Response → stdout
Tools run inside a Wasmtime WASM sandbox with fuel metering and capability control.
"""
publish = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for LLM API
reqwest = { version = "0.12", features = ["json", "stream"] }

# Home directory for config
dirs = "5"

# WASM sandbox runtime
wasmtime = { version = "28", features = ["component-model"] }
wasmtime-wasi = "28"

[workspace]
