[workspace]

[package]
name = "mini-agent-loop"
version = "0.1.0"
edition = "2021"
description = """
Minimal standalone extraction of IronClaw's agentic loop with OAuth 2.0 support.
Demonstrates: stdin → Agentic Loop → LLM → Tool Execute → Response → stdout
Plus: OAuth 2.0 Authorization Code + PKCE flow for tool authentication.
"""

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
# OAuth 2.0 dependencies
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
